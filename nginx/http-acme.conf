# Лимиты (личный сайт): accounts — 5 req/s burst 20; комментарии — 10 req/min burst 10.
limit_req_zone $binary_remote_addr zone=accounts:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=comments:10m rate=10r/m;

# Временный HTTP-конфиг для выпуска Let's Encrypt (webroot).
# После выпуска сертификата используется default.conf.

server {
    listen 80;
    server_name xn--b1afkfqeou7a.xn--p1ai www.xn--b1afkfqeou7a.xn--p1ai 158.160.180.56 _;
    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    location /accounts/ {
        limit_req zone=accounts burst=20 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ ^/(comments/|blog/comments/) {
        limit_req zone=comments burst=10 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
